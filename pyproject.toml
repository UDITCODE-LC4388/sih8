[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lunar-hazard-map"
version = "0.1.0"
description = "Generation of Hazard Maps at 1 m Grid Spacing Using Super-Resolution Techniques for Safe Lunar Lander Navigation (SIH260008 - ISRO)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary / ISRO SIH" }
authors = [
    { name = "Lunar Hazard Mapping Team" }
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "rasterio>=1.3.8",
    "pyyaml>=6.0.1",
    "pydantic>=2.5.0",
    "rich>=13.7.0",
    "typer>=0.9.0",
    "opencv-python-headless>=4.8.0",
    "scikit-image>=0.22.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.8.0",
    "tqdm>=4.66.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.11.0",
    "ruff>=0.1.6",
    "mypy>=1.7.0"
]
geo = [
    "gdal>=3.7.0",
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
    "pyproj>=3.6.0"
]
onnx = [
    "onnxruntime>=1.16.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = ["B008"]
